# Kept minimal on purpose: the standard linter set plus gofmt. Add a linter
# here when a class of mistake has actually shown up, not ahead of it, and
# leave the reason beside it.
version: "2"

# The tests that need root and a network namespace sit behind this tag.
# Lint them too, though `make test` does not run them.
run:
  build-tags:
    - netns

linters:
  default: standard

formatters:
  enable:
    - gofmt
